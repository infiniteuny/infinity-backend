                  description: 'Must be a valid UUID.  The <code>id</code> of an existing record in the teams table.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                  nullable: false
                competition_id:
                  type: string
                  description: 'Must be a valid UUID.  The <code>id</code> of an existing record in the competitions table.'
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                  nullable: false
                competition_team_type_id:
                  type: string
                  description: 'Must be a valid UUID.  The <code>id</code> of an existing record in the competition_team_types table.'
                  example: 977e5426-8d13-3824-86aa-b092f8ae52c5
                  nullable: false
                competition_scale_id:
                  type: string
                  description: 'Must be a valid UUID.  The <code>id</code> of an existing record in the competition_scales table.'
                  example: d6fa562b-acd5-35ff-babb-d11194d3737b
                  nullable: false
                competition_time_range_id:
                  type: string
                  description: 'Must be a valid UUID.  The <code>id</code> of an existing record in the competition_time_ranges table.'
                  example: 5707ca55-f609-3528-be8b-1baeaee1567e
                  nullable: false
                competition_output_id:
                  type: string
                  description: 'Must be a valid UUID.  The <code>id</code> of an existing record in the competition_outputs table.'
                  example: 947170af-7488-3f30-a16d-723355a9502f
                  nullable: false
                competition_rank_id:
                  type: string
                  description: 'Must be a valid UUID.  The <code>id</code> of an existing record in the competition_ranks table.'
                  example: cd1eb1ea-4697-3b9a-9dd0-988044a83af6
                  nullable: false
                competition_branch:
                  type: string
                  description: ''
                  example: architecto
                  nullable: false
                competition_start_date:
                  type: string
                  description: 'Must be a valid date. Must be a date before or equal to <code>competition_end_date</code>.'
                  example: '2021-04-28'
                  nullable: false
                competition_end_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>competition_start_date</code>.'
                  example: '2051-04-28'
                  nullable: false
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: false
                image:
                  type: string
                  format: binary
                  description: 'Must be a file. Must not be greater than 5120 kilobytes.'
                  nullable: false
                status:
                  type: string
                  description: ''
                  example: ACCEPTED
                  nullable: false
                  enum:
                    - PENDING
                    - REJECTED
                    - ACCEPTED
              required:
